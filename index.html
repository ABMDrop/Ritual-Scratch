<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ritual Scratch Secure</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  background:#05060f;
  color:white;
  font-family:Arial;
  padding:30px;
}

.card{
  max-width:500px;
  margin:auto;
  background:#111827;
  padding:30px;
  border-radius:20px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.connect{
  background:#7c3aed;
  color:white;
}

.claim{
  background:#059669;
  color:white;
  margin-top:20px;
}

.stats{
  margin-top:20px;
  padding:20px;
  background:#1f2937;
  border-radius:12px;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  background:#374151;
  color:white;
}

#status{
  margin-top:20px;
  color:#22c55e;
}

</style>
</head>

<body>

<div class="card">

<h1>Ritual Scratch Secure</h1>

<button class="connect" id="connectBtn">
Connect Wallet
</button>

<div class="stats">

<p>
Wallet:
<span id="walletText">
Not Connected
</span>
</p>

<p>
Points:
<span id="pointsText">
0
</span>
</p>

<p>
Scratches:
<span id="scratchText">
0
</span>
</p>

<p>
Cooldown:
<span id="cooldownText">
Ready
</span>
</p>

</div>

<input
id="usernameInput"
placeholder="Username"
/>

<button
class="claim"
id="claimBtn"
disabled
>
Claim Daily Scratch
</button>

<div id="status"></div>

</div>

<script>

const SUPABASE_URL =
'https://YOUR_PROJECT.supabase.co';

const SUPABASE_ANON_KEY =
'YOUR_ANON_KEY';

const FUNCTION_URL =
'https://YOUR_PROJECT.supabase.co/functions/v1/claim-points';

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let wallet = null;

let totalPoints = 0;

let totalScratches = 0;

let cooldownInterval = null;

const connectBtn =
document.getElementById('connectBtn');

const claimBtn =
document.getElementById('claimBtn');

const walletText =
document.getElementById('walletText');

const pointsText =
document.getElementById('pointsText');

const scratchText =
document.getElementById('scratchText');

const cooldownText =
document.getElementById('cooldownText');

const statusBox =
document.getElementById('status');

const usernameInput =
document.getElementById('usernameInput');



connectBtn.onclick =
async function(){

  if(!window.ethereum){

    alert('Install MetaMask');

    return;
  }

  try{

    const accounts =
    await window.ethereum.request({
      method:'eth_requestAccounts'
    });

    wallet = accounts[0];

    walletText.innerText =
    wallet.slice(0,6) +
    '...' +
    wallet.slice(-4);

    connectBtn.innerText =
    'Connected';

    claimBtn.disabled = false;

    await loadUser();

  }catch(err){

    alert(err.message);
  }
};



async function loadUser(){

  const { data } =
  await db
  .from('leaderboard')
  .select('*')
  .eq(
    'wallet_address',
    wallet.toLowerCase()
  )
  .single();

  if(!data){

    pointsText.innerText = '0';

    scratchText.innerText = '0';

    cooldownText.innerText = 'Ready';

    return;
  }

  totalPoints =
  data.total_points || 0;

  totalScratches =
  data.total_scratches || 0;

  pointsText.innerText =
  totalPoints;

  scratchText.innerText =
  totalScratches;

  usernameInput.value =
  data.username || '';

  if(data.last_claim){

    startCooldown(
      new Date(
        data.last_claim
      ).getTime()
    );
  }
}



function startCooldown(lastClaim){

  clearInterval(cooldownInterval);

  function update(){

    const now =
    Date.now();

    const diff =
    86400000 -
    (now - lastClaim);

    if(diff <= 0){

      cooldownText.innerText =
      'Ready';

      claimBtn.disabled = false;

      clearInterval(
        cooldownInterval
      );

      return;
    }

    claimBtn.disabled = true;

    const hours =
    Math.floor(
      diff / 3600000
    );

    const mins =
    Math.floor(
      (diff % 3600000)
      / 60000
    );

    const secs =
    Math.floor(
      (diff % 60000)
      / 1000
    );

    cooldownText.innerText =
      String(hours).padStart(2,'0')
      + ':' +
      String(mins).padStart(2,'0')
      + ':' +
      String(secs).padStart(2,'0');
  }

  update();

  cooldownInterval =
  setInterval(update,1000);
}



claimBtn.onclick =
async function(){

  if(!wallet){

    return;
  }

  claimBtn.disabled = true;

  statusBox.innerText =
  'Processing secure claim...';

  try{

    const response =
    await fetch(
      FUNCTION_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
          'application/json',

          'apikey':
          SUPABASE_ANON_KEY
        },

        body:JSON.stringify({
          wallet:
          wallet.toLowerCase(),

          username:
          usernameInput.value.trim()
        })
      }
    );

    const result =
    await response.json();

    if(!response.ok){

      throw new Error(
        result.error ||
        'Claim failed'
      );
    }

    totalPoints =
    result.total_points;

    totalScratches =
    result.total_scratches;

    pointsText.innerText =
    totalPoints;

    scratchText.innerText =
    totalScratches;

    statusBox.innerText =
    'Success! +' +
    result.points +
    ' points';

    startCooldown(Date.now());

  }catch(err){

    claimBtn.disabled = false;

    statusBox.innerText =
    err.message;
  }
};



if(window.ethereum){

  window.ethereum.on(
    'accountsChanged',
    function(accounts){

      if(accounts.length){

        location.reload();

      }else{

        wallet = null;

        connectBtn.innerText =
        'Connect Wallet';

        walletText.innerText =
        'Disconnected';

        claimBtn.disabled = true;
      }
    }
  );
}

</script>

</body>
</html>
